# Optional coverage-guided fuzzing with cargo-fuzz (008 FR-009, research R12).
# UNVERIFIED and NEVER BUILT by any gate: nightly Rust and libfuzzer-sys are not available on
# the development host, and no lock file is committed. Its own workspace (the root
# Cargo.toml excludes "fuzz"). Read README.md before first use.
[package]
name = "passwsync-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
# Version recorded, UNVERIFIED (not in the local crate cache; must pass cargo deny and
# cargo audit before first use).
libfuzzer-sys = "=0.4.10"
hardening = { path = "../crates/hardening" }
vault-core = { path = "../crates/vault-core", features = ["testkit"] }
vault-storage-file = { path = "../crates/vault-storage-file" }
wallet-service = { path = "../crates/wallet-service", features = ["testkit"] }
device-link = { path = "../crates/device-link", features = ["testkit"] }
device-link-net = { path = "../crates/device-link-net", features = ["testkit"] }
wallet-sync = { path = "../crates/wallet-sync", features = ["testkit"] }
host-runtime = { path = "../crates/host-runtime", features = ["testkit"] }
passwsyncd = { path = "../crates/passwsyncd" }
passwsync-ffi = { path = "../crates/passwsync-ffi", features = ["testkit"] }


[[bin]]
name = "wallet_header"
path = "fuzz_targets/wallet_header.rs"
test = false
doc = false
bench = false

