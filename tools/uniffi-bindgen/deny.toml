# Policy for the binding generator's own lock (build tool, never shipped; research R1).
[advisories]
version = 2
# 008 (research R18): every advisory kind fails. cargo-audit runs with `--deny warnings` and
# the same ignore list, read from this file by scripts/gate.sh (FR-036).
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # Unmaintained notice only (no vulnerability) for `basic-toml`, reached through
    # `askama_derive` of UniFFI's Kotlin templates. Build-time only: the generator runs on the
    # developer host and is not linked into the app or the desktop service.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, no vulnerability; build-time generator only" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSD-3-Clause", "ISC", "Zlib"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
