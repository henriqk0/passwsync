[package]
name = "passwsync-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Boundary crate of the passwsync Android app: the shared host runtime behind a UniFFI API"

[lib]
name = "passwsync_ffi"
crate-type = ["cdylib", "lib"]

[features]
testkit = ["host-runtime/testkit"]

[dependencies]
host-runtime = { path = "../host-runtime" }
wallet-service = { path = "../wallet-service" }
vault-core = { path = "../vault-core" }
device-link = { path = "../device-link" }
device-link-net = { path = "../device-link-net" }
wallet-sync = { path = "../wallet-sync" }
uniffi = { version = "=0.32.2", default-features = false }
rustix = { workspace = true, features = ["param"] }
zeroize = { workspace = true, features = ["derive"] }
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
passwsync-ffi = { path = ".", features = ["testkit"] }
host-runtime = { path = "../host-runtime", features = ["testkit"] }
wallet-service = { path = "../wallet-service", features = ["testkit"] }
vault-core = { path = "../vault-core", features = ["testkit"] }
device-link = { path = "../device-link", features = ["testkit"] }
device-link-net = { path = "../device-link-net", features = ["testkit"] }
wallet-sync = { path = "../wallet-sync", features = ["testkit"] }

# Not `workspace = true`: the workspace forbids unsafe code, and the single memory-protection
# module (src/memprotect.rs) needs it. Deny here; only that module allows it (FR-005).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
