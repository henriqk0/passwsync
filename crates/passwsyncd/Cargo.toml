[package]
name = "passwsyncd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local passwsync service: loopback HTTP server with an embedded web UI"

[dependencies]
wallet-service = { path = "../wallet-service" }
vault-core = { path = "../vault-core" }
vault-storage-file = { path = "../vault-storage-file" }
device-link = { path = "../device-link" }
device-link-net = { path = "../device-link-net" }
wallet-sync = { path = "../wallet-sync" }
host-runtime = { path = "../host-runtime" }
qrcodegen = { workspace = true }
rustix = { workspace = true }
httparse = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
signal-hook = { workspace = true }
zeroize = { version = "1", features = ["derive", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { workspace = true }

[dev-dependencies]
wallet-service = { path = "../wallet-service", features = ["testkit"] }
vault-core = { path = "../vault-core", features = ["testkit"] }
device-link = { path = "../device-link", features = ["testkit"] }
device-link-net = { path = "../device-link-net", features = ["testkit"] }
wallet-sync = { path = "../wallet-sync", features = ["testkit"] }
postcard = { version = "1", features = ["alloc"] }

[lints]
workspace = true
