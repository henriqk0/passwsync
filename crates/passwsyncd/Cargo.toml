[package]
name = "passwsyncd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local passwsync service: loopback HTTP server with an embedded web UI"

[dependencies]
wallet-service = { path = "../wallet-service" }
vault-core = { path = "../vault-core" }
vault-storage-file = { path = "../vault-storage-file" }
rustix = { workspace = true }
httparse = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
signal-hook = { workspace = true }
zeroize = { version = "1", features = ["derive", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
wallet-service = { path = "../wallet-service", features = ["testkit"] }
vault-core = { path = "../vault-core", features = ["testkit"] }

[lints]
workspace = true
