[package]
name = "wallet-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sans-IO wallet sync protocol for passwsync: codec, tags, rounds, records, journal, scheduler"

[features]
testkit = []

[dependencies]
vault-core = { path = "../vault-core" }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
wallet-sync = { path = ".", features = ["testkit"] }
vault-core = { path = "../vault-core", features = ["testkit"] }

[lints]
workspace = true
