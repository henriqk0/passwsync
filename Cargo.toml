[workspace]
members = [
    "crates/vault-core",
    "crates/vault-storage-file",
    "crates/wallet-service",
    "crates/passwsyncd",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"

[workspace.dependencies]
rustix = { version = "1.1", features = ["mm", "process", "fs", "time", "std"] }
httparse = "1.10"
serde_json = "1"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
subtle = "2.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Crypto dependencies are far too slow unoptimized; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 3
