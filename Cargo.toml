[workspace]
members = ["crates/vault-core", "crates/vault-storage-file"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Crypto dependencies are far too slow unoptimized; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 3
